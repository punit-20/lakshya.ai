<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Lakshya.AI Logo</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden
    }

    body {
      background: #070a11;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Orbitron', sans-serif;
    }

    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .logo-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    #logoSvg {
      width: 420px;
      height: 420px;
      overflow: visible;
      /* Very subtle — sharp neon look, not bloomy */
      filter:
        drop-shadow(0 0 2px #00ccee) drop-shadow(0 0 2px rgba(140, 0, 220, 0.25));
      animation: svgBreathe 5s ease-in-out infinite;
    }

    @keyframes svgBreathe {

      0%,
      100% {
        filter:
          drop-shadow(0 0 2px #00ccee) drop-shadow(0 0 2px rgba(140, 0, 220, 0.25));
      }

      50% {
        filter:
          drop-shadow(0 0 4px #00ddff) drop-shadow(0 0 4px rgba(160, 0, 240, 0.4));
      }
    }

    /* ── NEON TEXT — sharp, not bloomy ── */
    .text-lakshya {
      font-size: 62px;
      font-weight: 900;
      letter-spacing: 7px;
      color: #bb33ee;
      text-shadow:
        0 0 2px #fff,
        0 0 6px #cc44ff,
        0 0 14px rgba(120, 0, 200, 0.5);
      animation: textGlow 5s ease-in-out infinite;
    }

    .text-ai {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 5px;
      color: #00e5ff;
      text-shadow:
        0 0 2px #fff,
        0 0 6px #00ffff,
        0 0 12px rgba(0, 229, 255, 0.5);
      animation: textGlowCyan 5s ease-in-out infinite;
    }

    @keyframes textGlow {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.82;
        text-shadow:
          0 0 3px #fff,
          0 0 9px #dd55ff,
          0 0 20px rgba(140, 0, 210, 0.6);
      }
    }

    @keyframes textGlowCyan {
      0%,
      100% {
        opacity: 1;
        text-shadow:
          0 0 2px #fff,
          0 0 6px #00ffff,
          0 0 12px rgba(0, 229, 255, 0.5);
      }
      50% {
        opacity: 0.82;
        text-shadow:
          0 0 3px #fff,
          0 0 9px #00e5ff,
          0 0 20px rgba(0, 200, 255, 0.6);
      }
    }
  </style>
</head>

<body>
  <canvas id="bgCanvas"></canvas>

  <div class="logo-wrap">

    <!-- ═══════════════════════════════════════════════════
     MAIN LOGO SVG
═══════════════════════════════════════════════════ -->
    <svg id="logoSvg" viewBox="-175 -175 350 350" xmlns="http://www.w3.org/2000/svg">
      <defs>

        <!-- ── CYAN glow — single sharp pass ── -->
        <filter id="fCyan" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="b1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b2" />
          <feMerge>
            <feMergeNode in="b2" />
            <feMergeNode in="b1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- ── PURPLE/PINK glow — sharp ── -->
        <filter id="fPurp" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b2" />
          <feMerge>
            <feMergeNode in="b2" />
            <feMergeNode in="b1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- ── ARROW pink glow — sharp ── -->
        <filter id="fArrow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="b1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b2" />
          <feMerge>
            <feMergeNode in="b2" />
            <feMergeNode in="b1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- ── IRIS glow — moderate ── -->
        <filter id="fIris" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b2" />
          <feMerge>
            <feMergeNode in="b2" />
            <feMergeNode in="b1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- ── BOLT glow ── -->
        <filter id="fBolt" x="-150%" y="-150%" width="400%" height="400%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b2" />
          <feMerge>
            <feMergeNode in="b2" />
            <feMergeNode in="b1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- ── Circuit trace glow (tight) ── -->
        <filter id="fCircuit" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="b1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b2" />
          <feMerge>
            <feMergeNode in="b2" />
            <feMergeNode in="b1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- ── Radial gradients ── -->

          <stop offset="30%" stop-color="#2a0050" />
          <stop offset="65%" stop-color="#5500bb" />
          <stop offset="100%" stop-color="#8800dd" stop-opacity="0.1" />

          <stop offset="100%" stop-color="#330066" />

          <stop offset="0%" stop-color="#ff44ff" stop-opacity="0.9" />
          <stop offset="100%" stop-color="#aa00ff" stop-opacity="0" />
        </radialGradient>

══════════════════════════════════════════ -->

        <circle cx="0" cy="0" r="83" stroke="#9911cc" stroke-width="0.7" stroke-opacity="0.28" stroke-dasharray="4 10"
          stroke-dashoffset="15" />

  <!-- ═══════════════════════════════════════════════
     Background Canvas: Circuit board + starfield
═══════════════════════════════════════════════ -->
  <script>
    (function () {
      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');
      let W, H;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', () => { resize(); drawBg(); });

      /* ── static circuit board background ── */
      function drawBg() {
        // Dark radial gradient base
        const bg = ctx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, Math.max(W, H) * 0.78);
        bg.addColorStop(0, 'rgba(18,8,35,1)');
        bg.addColorStop(0.4, 'rgba(10,12,24,1)');
        bg.addColorStop(1, 'rgba(4,5,12,1)');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        // Circuit traces
        const STEP = 38;
        ctx.save();
        for (let x = 0; x < W; x += STEP) {
          for (let y = 0; y < H; y += STEP) {
            if (Math.random() > 0.5) {
              ctx.shadowBlur = 6;
              ctx.shadowColor = 'rgba(0,200,220,0.3)';
              ctx.strokeStyle = 'rgba(0,180,220,0.12)';
              ctx.lineWidth = 0.8;
              ctx.beginPath();
              const r = Math.floor(Math.random() * 4);
              if (r === 0) { ctx.moveTo(x, y); ctx.lineTo(x + STEP, y); }
              else if (r === 1) { ctx.moveTo(x, y); ctx.lineTo(x, y + STEP); }
              else if (r === 2) { ctx.moveTo(x + STEP, y); ctx.lineTo(x + STEP, y + STEP); }
              else { ctx.moveTo(x, y + STEP); ctx.lineTo(x + STEP, y + STEP); }
              ctx.stroke();
            }
            // Corner dot
            if (Math.random() > 0.78) {
              ctx.shadowBlur = 8;
              ctx.shadowColor = 'rgba(0,220,240,0.6)';
              ctx.fillStyle = 'rgba(0,200,230,0.22)';
              ctx.beginPath();
              ctx.arc(x, y, 1.6, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }
        ctx.restore();
      }

      drawBg();

      /* ── floating sparkle particles ── */
      const NPART = 70;
      const parts = Array.from({ length: NPART }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 1.8 + 0.3,
        a: Math.random(),
        va: (Math.random() - 0.5) * 0.015,
        vx: (Math.random() - 0.5) * 0.22,
        vy: (Math.random() - 0.5) * 0.22,
        hue: Math.random() > 0.5 ? 188 : 275,
        sparkle: Math.random() > 0.7
      }));

      // Draw static bg ONCE — no per-frame redraw (stops flicker)
      drawBg();

      // Offscreen canvas to composite particles onto the static bg
      const offscreen = document.createElement('canvas');
      const octx = offscreen.getContext('2d');

      function animLoop() {
        offscreen.width = W;
        offscreen.height = H;
        // Draw the static bg into offscreen each frame
        const bg2 = octx.createRadialGradient(W / 2, H / 2, 20, W / 2, H / 2, Math.max(W, H) * 0.78);
        bg2.addColorStop(0, 'rgba(18,8,35,1)');
        bg2.addColorStop(0.4, 'rgba(10,12,24,1)');
        bg2.addColorStop(1, 'rgba(4,5,12,1)');
        octx.fillStyle = bg2;
        octx.fillRect(0, 0, W, H);
        // Blit static circuit layer from the pre-drawn main canvas
        ctx.clearRect(0, 0, W, H);
        ctx.drawImage(offscreen, 0, 0);
        drawBg(); // redraw circuits on top

        parts.forEach(p => {
          p.x += p.vx; p.y += p.vy;
          p.a += p.va;
          if (p.a <= 0 || p.a >= 1) p.va *= -1;
          if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
          if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;

          const alpha = Math.max(0, Math.min(1, p.a));
          ctx.save();
          ctx.shadowBlur = p.r * 5;
          ctx.shadowColor = `hsla(${p.hue},100%,75%,${alpha * 0.7})`;
          ctx.fillStyle = `hsla(${p.hue},100%,80%,${alpha * 0.75})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();

          // Cross sparkle for larger bright ones
          if (p.sparkle && alpha > 0.65 && p.r > 1.2) {
            ctx.strokeStyle = `hsla(${p.hue},100%,90%,${alpha * 0.4})`;
            ctx.lineWidth = 0.5;
            ctx.shadowBlur = 6;
            ctx.beginPath();
            ctx.moveTo(p.x - p.r * 3, p.y);
            ctx.lineTo(p.x + p.r * 3, p.y);
            ctx.moveTo(p.x, p.y - p.r * 3);
            ctx.lineTo(p.x, p.y + p.r * 3);
            ctx.stroke();
          }
          ctx.restore();
        });

        requestAnimationFrame(animLoop);
      }
      animLoop();
    })();
  </script>

  <!-- Arrow pulse animation -->
  <script>
    (function () {
      const svg = document.getElementById('logoSvg');
      let t = 0;
      function pulse() {
        t += 0.03;
        // Pulsing arrows opacity
        const arrowGroups = svg.querySelectorAll('[filter="url(#fArrow)"]');
        arrowGroups.forEach(g => {
          g.style.opacity = (0.75 + Math.sin(t) * 0.25).toFixed(3);
        });
        // Rotate the circuit traces ring slowly
        const circuitGroup = svg.querySelector('[filter="url(#fCircuit)"]');
        if (circuitGroup) {
          // don't rotate — just let it be static (circuits shouldn't spin)
        }
        requestAnimationFrame(pulse);
      }
      pulse();
    })();
  </script>
