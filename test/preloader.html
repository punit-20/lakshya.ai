<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Lakshya.AI AI Boot System</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Outfit:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #020408;
      font-family: 'Orbitron', sans-serif;
      color: #e2e8f0;
    }

    /* ══════════ SCENE LAYERS ══════════ */

    /* Perspective grid canvas — behind everything */
    #gridCanvas {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 0;
    }

    /* Particle canvas — above grid */
    #particleCanvas {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* ══════════ PRELOADER SCREEN ══════════ */
    .preloader-screen {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 1.2s ease, transform 1.2s ease, visibility 1.2s ease;
    }

    .preloader-screen.exit-animation {
      opacity: 0; transform: scale(1.15);
      pointer-events: none; visibility: hidden;
    }

    /* ══════════ 3D SCENE CONTAINER ══════════ */
    .scene-3d {
      position: relative;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      perspective: 1000px;
    }

    /* Logo + text floats above the platform */
    .floating-assembly {
      position: relative;
      display: flex; flex-direction: column;
      align-items: center;
      transform-style: preserve-3d;
      animation: floatUpDown 4s ease-in-out infinite;
      margin-bottom: -20px;
      z-index: 5;
    }

    @keyframes floatUpDown {
      0%, 100% { transform: translateY(0px) rotateX(2deg); }
      50% { transform: translateY(-18px) rotateX(-2deg); }
    }

    /* ══════════ SVG LOGO ══════════ */
    #logoSvg {
      width: 380px; height: 380px;
      overflow: visible;
      filter:
        drop-shadow(0 0 15px rgba(0, 229, 255, 0.4))
        drop-shadow(0 0 40px rgba(187, 51, 238, 0.3))
        drop-shadow(0 0 80px rgba(99, 102, 241, 0.15));
    }

    /* Outer glow halo behind the logo */
    .logo-glow-halo {
      position: absolute;
      top: 50%; left: 50%;
      width: 500px; height: 500px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(0, 229, 255, 0.08) 0%,
        rgba(187, 51, 238, 0.06) 35%,
        rgba(0, 0, 0, 0) 70%
      );
      pointer-events: none;
      animation: haloBreath 3s ease-in-out infinite alternate;
      z-index: -1;
    }

    @keyframes haloBreath {
      0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    }

    /* ══════════ BRAND TEXT ══════════ */
    .brand-title-wrap {
      display: flex; justify-content: center;
      align-items: baseline; gap: 6px;
      margin-top: 15px;
    }

    .brand-letter {
      font-size: 52px; font-weight: 900;
      color: #cc44ff; opacity: 0;
      transform: translateY(20px) scale(0.7);
      text-shadow: none;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .brand-letter.visible {
      opacity: 1; transform: translateY(0) scale(1);
      color: #dd66ff;
      text-shadow:
        0 0 6px #fff,
        0 0 15px #cc44ff,
        0 0 40px rgba(187, 51, 238, 0.7),
        0 0 80px rgba(187, 51, 238, 0.3);
    }

    .brand-ai {
      font-size: 42px; font-weight: 900;
      color: #00e5ff; opacity: 0;
      margin-left: 4px;
      transform: translateY(10px);
      transition: all 0.6s ease-out 0.1s;
    }

    .brand-ai.visible {
      opacity: 1; transform: translateY(0);
      text-shadow:
        0 0 6px #fff,
        0 0 15px #00ffff,
        0 0 40px rgba(0, 229, 255, 0.6),
        0 0 80px rgba(0, 229, 255, 0.2);
      animation: aiPulse 3s ease-in-out infinite;
    }

    @keyframes aiPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.3) hue-rotate(10deg); }
    }

    /* ══════════ 3D FLOATING PLATFORM ══════════ */
    .platform-container {
      position: relative;
      width: 600px; height: 60px;
      margin-top: 5px;
      z-index: 4;
    }

    .platform-ring {
      position: absolute; left: 50%;
      border-radius: 50%;
      border: 1.5px solid;
      transform: translateX(-50%) rotateX(70deg);
    }

    .platform-ring.r1 {
      width: 500px; height: 120px; top: -25px;
      border-color: rgba(0, 229, 255, 0.25);
      box-shadow:
        0 0 15px rgba(0, 229, 255, 0.15),
        inset 0 0 15px rgba(0, 229, 255, 0.05);
      animation: platformPulse 3s ease-in-out infinite;
    }

    .platform-ring.r2 {
      width: 440px; height: 105px; top: -18px;
      border-color: rgba(187, 51, 238, 0.2);
      box-shadow:
        0 0 12px rgba(187, 51, 238, 0.12),
        inset 0 0 12px rgba(187, 51, 238, 0.04);
      animation: platformPulse 3s ease-in-out 0.5s infinite;
    }

    .platform-ring.r3 {
      width: 380px; height: 90px; top: -12px;
      border-color: rgba(0, 229, 255, 0.15);
      box-shadow: 0 0 8px rgba(0, 229, 255, 0.08);
      animation: platformPulse 3s ease-in-out 1s infinite;
    }

    /* Bright base line */
    .platform-glow-line {
      position: absolute; left: 50%; top: 5px;
      width: 520px; height: 2px;
      transform: translateX(-50%);
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(0, 229, 255, 0.6) 20%,
        rgba(0, 229, 255, 0.9) 50%,
        rgba(0, 229, 255, 0.6) 80%,
        transparent 100%
      );
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.4), 0 0 60px rgba(0, 229, 255, 0.15);
      border-radius: 50%;
      animation: platformPulse 3s ease-in-out infinite;
    }

    /* Reflection below platform */
    .platform-reflection {
      position: absolute; left: 50%; top: 15px;
      width: 350px; height: 80px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse,
        rgba(0, 229, 255, 0.06) 0%,
        rgba(187, 51, 238, 0.03) 40%,
        transparent 70%
      );
      border-radius: 50%;
    }

    @keyframes platformPulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    /* ══════════ BOOT STATUS & PROGRESS ══════════ */
    .boot-status-panel {
      width: 480px;
      display: flex; flex-direction: column;
      align-items: center;
      margin-top: 30px;
      z-index: 6;
    }

    .boot-message-log {
      height: 22px;
      font-size: 0.72rem; font-weight: 500;
      font-family: 'Orbitron', monospace;
      color: #00ffcc;
      text-shadow: 0 0 12px rgba(0, 255, 204, 0.5);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .progress-box {
      width: 100%;
      display: flex; align-items: center;
      gap: 14px; margin-bottom: 8px;
    }

    .bar-wrapper {
      flex-grow: 1; height: 18px;
      position: relative;
      background: rgba(0, 20, 40, 0.6);
      border: 1.5px solid rgba(0, 229, 255, 0.25);
      border-radius: 25px;
      overflow: hidden;
      box-shadow:
        inset 0 0 10px rgba(0, 229, 255, 0.08),
        0 0 15px rgba(0, 229, 255, 0.1);
    }

    .bar-fill {
      width: 0%; height: 100%;
      background: linear-gradient(90deg, #00b8d4, #00e5ff, #00ffcc);
      border-radius: 25px;
      transition: width 0.15s linear;
      position: relative;
      box-shadow:
        0 0 10px rgba(0, 229, 255, 0.6),
        0 0 25px rgba(0, 229, 255, 0.3),
        inset 0 1px 1px rgba(255, 255, 255, 0.3);
    }

    .bar-fill::after {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      animation: shimmer 2s infinite linear;
      border-radius: 25px;
    }

    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }

    .progress-percent {
      font-size: 1rem; font-weight: 900;
      color: #00e5ff;
      text-shadow: 0 0 12px rgba(0, 229, 255, 0.7);
      min-width: 48px; text-align: right;
    }

    .sub-brand-line {
      font-size: 0.6rem; font-weight: 500;
      letter-spacing: 5px; color: rgba(100, 116, 139, 0.7);
      margin-top: 10px;
      text-transform: uppercase;
      text-align: center;
    }

    /* ══════════ CAMERA SHAKE ══════════ */
    .scene-3d.shake-pulse {
      animation: camShake 0.35s ease-in-out;
    }

    @keyframes camShake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-2px, 2px); }
      50% { transform: translate(2px, -2px); }
      75% { transform: translate(-2px, -1px); }
    }

    /* ══════════ DASHBOARD REVEAL ══════════ */
    .dashboard-reveal-container {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 200;
      opacity: 0; visibility: hidden;
      background: radial-gradient(ellipse at center, #0d091e 0%, #020408 100%);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 1s ease 0.3s, visibility 1s ease 0.3s;
    }

    .dashboard-reveal-container.visible {
      opacity: 1; visibility: visible;
    }

    .demo-dashboard-card {
      background: rgba(10, 15, 30, 0.7);
      border: 1px solid rgba(0, 229, 255, 0.1);
      border-radius: 20px; padding: 3rem;
      width: 650px; text-align: center;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.6),
        inset 0 0 20px rgba(0, 229, 255, 0.05),
        0 0 40px rgba(187, 51, 238, 0.08);
      backdrop-filter: blur(20px);
      transform: translateY(30px);
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .dashboard-reveal-container.visible .demo-dashboard-card {
      transform: translateY(0);
    }

    .demo-title {
      font-size: 2.2rem; font-weight: 900;
      letter-spacing: 5px;
      background: linear-gradient(135deg, #00ffff, #bb33ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1.5rem;
    }

    .demo-text {
      color: #94a3b8; font-size: 0.9rem;
      line-height: 1.7; margin-bottom: 2rem;
      font-family: 'Outfit', sans-serif;
    }

    .btn-action {
      background: linear-gradient(135deg, #00b8d4, #6366f1, #a855f7);
      border: none; padding: 0.9rem 2.2rem;
      border-radius: 30px; color: #fff;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem; font-weight: 700;
      letter-spacing: 2px; cursor: pointer;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
      transition: all 0.3s;
    }

    .btn-action:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.6);
    }
  </style>
</head>

<body>
  <!-- Layer 0: Perspective grid -->
  <canvas id="gridCanvas"></canvas>
  <!-- Layer 1: Floating particles -->
  <canvas id="particleCanvas"></canvas>

  <!-- Dashboard Reveal (post-boot) -->
  <div class="dashboard-reveal-container" id="dashboardReveal">
    <div class="demo-dashboard-card">
      <h1 class="demo-title">LAKSHYA.AI</h1>
      <p class="demo-text">
        Welcome to the AI-Powered Lead Generation &amp; Outreach Automation platform.<br/>
        System initialization complete. All neural engines online.
      </p>
      <button class="btn-action" onclick="restartBootSequence()">REPLAY BOOT SEQUENCE</button>
    </div>
  </div>

  <!-- ═══ PRELOADER SCENE ═══ -->
  <div class="preloader-screen" id="preloaderScreen">
    <div class="scene-3d" id="scene3d">

      <!-- Floating Logo + Text Assembly -->
      <div class="floating-assembly" id="floatingAssembly">
        <div class="logo-glow-halo"></div>

    <!-- ═══════════════════════════════════════════════════
     MAIN LOGO SVG
═══════════════════════════════════════════════════ -->
    <svg id="logoSvg" viewBox="-175 -175 350 350" xmlns="http://www.w3.org/2000/svg">
      <defs>

        <!-- ── CYAN glow — single sharp pass ── -->
        <filter id="fCyan" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="b1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b2" />
          <feMerge>
            <feMergeNode in="b2" />
            <feMergeNode in="b1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- ── PURPLE/PINK glow — sharp ── -->
        <filter id="fPurp" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b2" />
          <feMerge>
            <feMergeNode in="b2" />
            <feMergeNode in="b1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- ── ARROW pink glow — sharp ── -->
        <filter id="fArrow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="b1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b2" />
          <feMerge>
            <feMergeNode in="b2" />
            <feMergeNode in="b1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- ── IRIS glow — moderate ── -->
        <filter id="fIris" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b2" />
          <feMerge>
            <feMergeNode in="b2" />
            <feMergeNode in="b1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- ── BOLT glow ── -->
        <filter id="fBolt" x="-150%" y="-150%" width="400%" height="400%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b2" />
          <feMerge>
            <feMergeNode in="b2" />
            <feMergeNode in="b1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- ── Circuit trace glow (tight) ── -->
        <filter id="fCircuit" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="b1" />
          <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b2" />
          <feMerge>
            <feMergeNode in="b2" />
            <feMergeNode in="b1" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>

        <!-- ── Radial gradients ── -->
        <radialGradient id="gIris" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#0d0020" />
          <stop offset="30%" stop-color="#2a0050" />
          <stop offset="65%" stop-color="#5500bb" />
          <stop offset="100%" stop-color="#8800dd" stop-opacity="0.1" />
        </radialGradient>

        <radialGradient id="gPupil" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#05000e" />
          <stop offset="55%" stop-color="#110022" />
          <stop offset="100%" stop-color="#330066" />
        </radialGradient>

        <!-- Spoke burst gradient (for iris rays) -->
        <radialGradient id="gSpoke" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ff44ff" stop-opacity="0.9" />
          <stop offset="100%" stop-color="#aa00ff" stop-opacity="0" />
        </radialGradient>

      </defs>

      <!-- ══════════════════════════════════════════
     LAYER 1: Outermost cyan concentric rings — SHARP & DENSE
══════════════════════════════════════════ -->
      <!-- Glow copies (low opacity) -->
      <g opacity="0.3" filter="url(#fCyan)">
        <circle cx="0" cy="0" r="162" fill="none" stroke="#00ffff" stroke-width="3" />
        <circle cx="0" cy="0" r="155" fill="none" stroke="#00eeff" stroke-width="2" />
        <circle cx="0" cy="0" r="148" fill="none" stroke="#00e5ff" stroke-width="2" />
        <circle cx="0" cy="0" r="140" fill="none" stroke="#00d4ff" stroke-width="2" />
        <circle cx="0" cy="0" r="132" fill="none" stroke="#00c8ff" stroke-width="2" />
        <circle cx="0" cy="0" r="124" fill="none" stroke="#00bbee" stroke-width="2" />
        <circle cx="0" cy="0" r="116" fill="none" stroke="#00aadd" stroke-width="2" />
        <circle cx="0" cy="0" r="108" fill="none" stroke="#0099cc" stroke-width="2" />
      </g>
      <!-- Sharp crisp ring cores -->
      <g fill="none" id="cyanRings">
        <!-- Outermost ring group -->
        <circle cx="0" cy="0" r="162" stroke="#00e8ff" stroke-width="1.5" stroke-opacity="0.7" />
        <circle cx="0" cy="0" r="158" stroke="#00ccee" stroke-width="0.6" stroke-opacity="0.35" />
        <circle cx="0" cy="0" r="155" stroke="#00e0ff" stroke-width="1.2" stroke-opacity="0.65" />
        <circle cx="0" cy="0" r="151" stroke="#00bbdd" stroke-width="0.5" stroke-opacity="0.25" />
        <circle cx="0" cy="0" r="148" stroke="#00d8ff" stroke-width="1.4" stroke-opacity="0.68" />
        <circle cx="0" cy="0" r="144" stroke="#009abb" stroke-width="0.4" stroke-opacity="0.2" />
        <!-- Middle cyan rings -->
        <circle cx="0" cy="0" r="140" stroke="#00d0ff" stroke-width="1.4" stroke-opacity="0.65" />
        <circle cx="0" cy="0" r="136" stroke="#007799" stroke-width="0.4" stroke-opacity="0.18" />
        <circle cx="0" cy="0" r="132" stroke="#00ccff" stroke-width="1.3" stroke-opacity="0.6" />
        <circle cx="0" cy="0" r="128" stroke="#006688" stroke-width="0.4" stroke-opacity="0.18" />
        <circle cx="0" cy="0" r="124" stroke="#00c4f8" stroke-width="1.2" stroke-opacity="0.55" />
        <circle cx="0" cy="0" r="120" stroke="#00bbee" stroke-width="0.9" stroke-opacity="0.4" />
        <circle cx="0" cy="0" r="116" stroke="#00aadd" stroke-width="1.1" stroke-opacity="0.5" />
        <circle cx="0" cy="0" r="112" stroke="#009acc" stroke-width="0.7" stroke-opacity="0.3" />
        <circle cx="0" cy="0" r="108" stroke="#008ab8" stroke-width="1" stroke-opacity="0.45" />
      </g>

      <!-- ══════════════════════════════════════════
     LAYER 2: Purple / pink rings — DENSE & SHARP
══════════════════════════════════════════ -->
      <!-- Glow pass (low opacity) -->
      <g opacity="0.35" filter="url(#fPurp)">
        <circle cx="0" cy="0" r="104" fill="none" stroke="#cc44ff" stroke-width="4" />
        <circle cx="0" cy="0" r="97" fill="none" stroke="#bb33ee" stroke-width="3" />
        <circle cx="0" cy="0" r="90" fill="none" stroke="#aa22dd" stroke-width="3" />
        <circle cx="0" cy="0" r="83" fill="none" stroke="#9911cc" stroke-width="3" />
      </g>
      <!-- Sharp crisp purple ring cores -->
      <g fill="none" id="purpleRings">
        <circle cx="0" cy="0" r="104" stroke="#dd55ff" stroke-width="1.6" stroke-opacity="0.75" />
        <circle cx="0" cy="0" r="101" stroke="#883399" stroke-width="0.4" stroke-opacity="0.22" />
        <circle cx="0" cy="0" r="98" stroke="#cc44ff" stroke-width="1.3" stroke-opacity="0.68" />
        <circle cx="0" cy="0" r="95" stroke="#772288" stroke-width="0.4" stroke-opacity="0.2" />
        <circle cx="0" cy="0" r="92" stroke="#bb33ee" stroke-width="1.2" stroke-opacity="0.62" />
        <circle cx="0" cy="0" r="89" stroke="#661177" stroke-width="0.4" stroke-opacity="0.18" />
        <circle cx="0" cy="0" r="86" stroke="#aa22dd" stroke-width="1.1" stroke-opacity="0.58" />
        <circle cx="0" cy="0" r="83" stroke="#550066" stroke-width="0.4" stroke-opacity="0.18" />
        <circle cx="0" cy="0" r="80" stroke="#9911cc" stroke-width="1" stroke-opacity="0.5" />
      </g>

      <!-- ══════════════════════════════════════════
     LAYER 3: Cyan crosshair axis lines
══════════════════════════════════════════ -->
      <g filter="url(#fCyan)" stroke="#00e5ff" stroke-linecap="round">
        <line x1="0" y1="-165" x2="0" y2="-87" stroke-width="2.5" stroke-opacity="0.8" />
        <line x1="0" y1="87" x2="0" y2="165" stroke-width="2.5" stroke-opacity="0.8" />
        <line x1="-165" y1="0" x2="-87" y2="0" stroke-width="2.5" stroke-opacity="0.8" />
        <line x1="87" y1="0" x2="165" y2="0" stroke-width="2.5" stroke-opacity="0.8" />
      </g>
      <!-- bright white cores for crosshair -->
      <g stroke="#ccffff" stroke-linecap="round" stroke-opacity="0.5">
        <line x1="0" y1="-165" x2="0" y2="-87" stroke-width="0.8" />
        <line x1="0" y1="87" x2="0" y2="165" stroke-width="0.8" />
        <line x1="-165" y1="0" x2="-87" y2="0" stroke-width="0.8" />
        <line x1="87" y1="0" x2="165" y2="0" stroke-width="0.8" />
      </g>

      <!-- Diagonal cross lines (faint cyan) -->

  <!-- ═══════════════════════════════════════════════
     SCRIPT 1: Perspective Grid Canvas
  ═══════════════════════════════════════════════ -->
  <script>
    (function() {
      const canvas = document.getElementById('gridCanvas');
      const ctx = canvas.getContext('2d');
      let W, H;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        drawGrid();
      }

      function drawGrid() {
        // Deep dark background with radial center glow
        const bg = ctx.createRadialGradient(W/2, H*0.45, 10, W/2, H*0.45, Math.max(W,H)*0.9);
        bg.addColorStop(0, '#0d0a1e');
        bg.addColorStop(0.3, '#080616');
        bg.addColorStop(0.6, '#04030c');
        bg.addColorStop(1, '#010108');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        // Vanishing point perspective grid (bottom half)
        const vpX = W / 2;
        const vpY = H * 0.42;
        const horizon = H * 0.55;

        ctx.save();

        // Radial lines from vanishing point
        const numRays = 40;
        for (let i = 0; i < numRays; i++) {
          const angle = (i / numRays) * Math.PI * 2;
          const endX = vpX + Math.cos(angle) * W * 1.5;
          const endY = vpY + Math.sin(angle) * H * 2;

          // Only draw bottom-half rays (perspective floor)
          if (endY > horizon) {
            const grad = ctx.createLinearGradient(vpX, vpY, endX, endY);
            grad.addColorStop(0, 'rgba(0, 229, 255, 0.0)');
            grad.addColorStop(0.3, 'rgba(0, 229, 255, 0.06)');
            grad.addColorStop(0.6, 'rgba(187, 51, 238, 0.04)');
            grad.addColorStop(1, 'rgba(0, 229, 255, 0.0)');
            ctx.strokeStyle = grad;
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            ctx.moveTo(vpX, horizon);
            ctx.lineTo(endX, endY);
            ctx.stroke();
          }
        }

        // Horizontal perspective lines (floor grid)
        const numHLines = 18;
        for (let i = 1; i <= numHLines; i++) {
          const t = i / numHLines;
          const y = horizon + (H - horizon) * (t * t); // Quadratic spacing for perspective
          const spread = W * 0.5 + (W * 0.8) * t;
          const alpha = 0.03 + t * 0.06;

          ctx.strokeStyle = `rgba(0, 229, 255, ${alpha})`;
          ctx.lineWidth = 0.5;
          ctx.beginPath();
          ctx.moveTo(vpX - spread, y);
          ctx.lineTo(vpX + spread, y);
          ctx.stroke();
        }

        // Top-half: scattered circuit traces
        ctx.shadowBlur = 0;
        const STEP = 45;
        // Seeded random for consistent circuit pattern
        let seed = 42;
        function seededRandom() {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        }
        for (let x = 0; x < W; x += STEP) {
          for (let y = 0; y < H * 0.65; y += STEP) {
            if (seededRandom() > 0.6) {
              const isCyan = seededRandom() > 0.3;
              const baseColor = isCyan ? '0, 229, 255' : '187, 51, 238';
              const alpha = 0.04 + seededRandom() * 0.06;
              ctx.strokeStyle = `rgba(${baseColor}, ${alpha})`;
              ctx.lineWidth = 0.5 + seededRandom() * 0.5;
              ctx.beginPath();
              const r = Math.floor(seededRandom() * 4);
              if (r === 0) { ctx.moveTo(x, y); ctx.lineTo(x + STEP, y); }
              else if (r === 1) { ctx.moveTo(x, y); ctx.lineTo(x, y + STEP); }
              else if (r === 2) { ctx.moveTo(x, y); ctx.lineTo(x + STEP/2, y + STEP/2); }
              else { ctx.moveTo(x + STEP, y); ctx.lineTo(x + STEP, y + STEP); }
              ctx.stroke();

              // Node dots at junctions
              if (seededRandom() > 0.65) {
                ctx.fillStyle = `rgba(${baseColor}, ${alpha * 2.5})`;
                ctx.beginPath();
                ctx.arc(x, y, 1.2, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
        }

        ctx.restore();
      }

      resize();
      window.addEventListener('resize', resize);
    })();
  </script>

  <!-- ═══════════════════════════════════════════════
     SCRIPT 2: Floating Particle System
  ═══════════════════════════════════════════════ -->
  <script>
    (function() {
      const canvas = document.getElementById('particleCanvas');
      const ctx = canvas.getContext('2d');
      let W, H;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const NUM = 90;
      const particles = [];
      for (let i = 0; i < NUM; i++) {
        particles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: Math.random() * 2.2 + 0.3,
          alpha: Math.random(),
          da: (Math.random() - 0.5) * 0.012,
          vx: (Math.random() - 0.5) * 0.25,
          vy: (Math.random() - 0.5) * 0.18,
          hue: Math.random() > 0.4 ? 188 : 280,
          sparkle: Math.random() > 0.65
        });
      }

      function animateParticles() {
        ctx.clearRect(0, 0, W, H);

        particles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.alpha += p.da;
          if (p.alpha <= 0.05 || p.alpha >= 1) p.da *= -1;
          if (p.x < -5) p.x = W + 5;
          if (p.x > W + 5) p.x = -5;
          if (p.y < -5) p.y = H + 5;
          if (p.y > H + 5) p.y = -5;

          const a = Math.max(0, Math.min(1, p.alpha));

          ctx.save();
          ctx.globalAlpha = a * 0.85;
          ctx.shadowBlur = p.r * 6;
          ctx.shadowColor = `hsla(${p.hue}, 100%, 70%, ${a * 0.8})`;
          ctx.fillStyle = `hsla(${p.hue}, 100%, 78%, ${a})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();

          // Cross sparkle on bright large particles
          if (p.sparkle && a > 0.6 && p.r > 1.4) {
            ctx.strokeStyle = `hsla(${p.hue}, 100%, 90%, ${a * 0.35})`;
            ctx.lineWidth = 0.4;
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.moveTo(p.x - p.r * 4, p.y);
            ctx.lineTo(p.x + p.r * 4, p.y);
            ctx.moveTo(p.x, p.y - p.r * 4);
            ctx.lineTo(p.x, p.y + p.r * 4);
            ctx.stroke();
          }

          ctx.restore();
        });

        requestAnimationFrame(animateParticles);
      }
      animateParticles();
    })();
  </script>

  <!-- ═══════════════════════════════════════════════
     SCRIPT 3: Boot Sequence + Ring Rotation + Eye Blink
  ═══════════════════════════════════════════════ -->
  <script>
    (function() {
      const svg = document.getElementById('logoSvg');
      const cyanRings = document.getElementById('cyanRings');
      const purpleRings = document.getElementById('purpleRings');
      const eyeWholeGroup = document.getElementById('eyeWholeGroup');
      const scene3d = document.getElementById('scene3d');
      const floatingAssembly = document.getElementById('floatingAssembly');

      const bootMessage = document.getElementById('bootMessage');
      const progressBarFill = document.getElementById('progressBarFill');
      const progressNumber = document.getElementById('progressNumber');
      const brandAiSuffix = document.getElementById('brand-ai-suffix');
      const preloaderScreen = document.getElementById('preloaderScreen');
      const dashboardReveal = document.getElementById('dashboardReveal');

      const letters = [
        document.getElementById('letter-L'),
        document.getElementById('letter-A'),
        document.getElementById('letter-K'),
        document.getElementById('letter-S'),
        document.getElementById('letter-H'),
        document.getElementById('letter-Y'),
        document.getElementById('letter-A2')
      ];

      const bootSteps = [
        { progress: 0,   text: "Initializing AI Core..." },
        { progress: 15,  text: "Loading Neural Engine..." },
        { progress: 32,  text: "Scanning Data Sources..." },
        { progress: 50,  text: "Connecting AI Agents..." },
        { progress: 68,  text: "Training Intent Model..." },
        { progress: 85,  text: "Finalizing Launch Protocols..." },
        { progress: 100, text: "█ Launching Lakshya.ai █" }
      ];

      let angle = 0;
      let pulseTime = 0;
      let blinkClock = 0;
      let isBlinking = false;
      let blinkT = 0;
      let currentProgress = 0;
      let targetProgress = 0;
      let bootFinished = false;

      // ── Mouse parallax on floating assembly ──
      document.addEventListener('mousemove', (e) => {
        if (bootFinished) return;
        const w = window.innerWidth;
        const h = window.innerHeight;
        const mx = (e.clientX - w / 2) / (w / 2); // -1 to 1
        const my = (e.clientY - h / 2) / (h / 2);
        floatingAssembly.style.transform =
          `translateY(${-10 + my * 8}px) rotateY(${mx * 12}deg) rotateX(${-my * 8}deg)`;
      });

      // ── Restart function ──
      window.restartBootSequence = function() {
        bootFinished = false;
        currentProgress = 0;
        targetProgress = 0;
        progressBarFill.style.width = '0%';
        progressNumber.innerText = '0%';
        bootMessage.innerText = bootSteps[0].text;
        brandAiSuffix.classList.remove('visible');
        letters.forEach(el => el.classList.remove('visible'));
        preloaderScreen.classList.remove('exit-animation');
        preloaderScreen.style.display = '';
        preloaderScreen.style.opacity = '1';
        preloaderScreen.style.visibility = 'visible';
        dashboardReveal.classList.remove('visible');
        driveProgress();
      };

      function driveProgress() {
        if (currentProgress >= 100) return;
        const increment = Math.floor(Math.random() * 12) + 6;
        targetProgress = Math.min(100, targetProgress + increment);
        setTimeout(driveProgress, Math.random() * 700 + 350);
      }

      driveProgress();

      function updateProgress() {
        if (currentProgress < targetProgress) {
          currentProgress += 0.4;
          if (currentProgress > 100) currentProgress = 100;

          progressBarFill.style.width = `${currentProgress}%`;
          progressNumber.innerText = `${Math.floor(currentProgress)}%`;

          // Update boot status text
          let status = bootSteps[0].text;
          for (const step of bootSteps) {
            if (currentProgress >= step.progress) status = step.text;
          }
          if (bootMessage.innerText !== status) {
            bootMessage.innerText = status;
            scene3d.classList.add('shake-pulse');
            setTimeout(() => scene3d.classList.remove('shake-pulse'), 350);
          }

          // Light up LAKSHYA letters
          const idx = Math.floor(currentProgress / 13);
          for (let i = 0; i < letters.length; i++) {
            if (i <= idx && currentProgress > 4) {
              letters[i].classList.add('visible');
            }
          }

          // Reveal .AI
          if (currentProgress >= 95) {
            brandAiSuffix.classList.add('visible');
          }

          // Boot complete → exit
          if (currentProgress >= 100 && !bootFinished) {
            bootFinished = true;
            setTimeout(() => {
              preloaderScreen.classList.add('exit-animation');
              dashboardReveal.classList.add('visible');
            }, 900);
          }
        }
      }

      function mainLoop() {
        angle += 0.35;
        pulseTime += 0.03;
        blinkClock++;

        // 1. Counter-rotate rings
        if (cyanRings) cyanRings.setAttribute('transform', `rotate(${angle * 0.4})`);
        if (purpleRings) purpleRings.setAttribute('transform', `rotate(${-angle * 0.7})`);

        // 2. Pulse arrows
        const arrows = svg.querySelectorAll('[filter="url(#fArrow)"]');
        arrows.forEach(g => {
          g.style.opacity = (0.65 + Math.sin(pulseTime) * 0.35).toFixed(3);
        });

        // 3. Eye blink every ~4 seconds
        if (!isBlinking && blinkClock % 250 === 0 && blinkClock > 60) {
          isBlinking = true;
          blinkT = 0;
        }
        if (isBlinking) {
          blinkT += 0.12;
          const scaleY = 1 - Math.abs(Math.sin(blinkT * Math.PI)) * 0.96;
          if (eyeWholeGroup) {
            eyeWholeGroup.setAttribute('transform', `scale(1, ${scaleY})`);
          }
          if (blinkT >= 1) {
            isBlinking = false;
            if (eyeWholeGroup) eyeWholeGroup.removeAttribute('transform');
          }
        }

        // 4. Iris glow pulse
        const irisCircles = svg.querySelectorAll('[filter="url(#fIris)"]');
        irisCircles.forEach(g => {
          g.style.opacity = (0.8 + Math.sin(pulseTime * 1.5) * 0.2).toFixed(3);
        });

        // 5. Update progress
        updateProgress();

        requestAnimationFrame(mainLoop);
      }

      mainLoop();
    })();
  </script>
